[package]
name = "dvm"
version = "1.31.0"
description = "DVM(Demodemo Video Manager)— Windows 向け動画管理ソフト"
authors = ["taiki"]
edition = "2021"
default-run = "dvm"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dvm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-libmpv = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.2"
rusqlite = { version = "0.40.1", features = ["bundled"] }
walkdir = "2.5.0"
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }
rayon = "1.12.0"
anyhow = "1.0.104"
notify = "8.2.0"
trash = "5"
tauri-plugin-window-state = "2.4.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
  "Win32_Storage_FileSystem",
  "Win32_Foundation",
  # 字幕設定のフォント候補(EnumFontFamiliesExW)と、モニタの特定(MonitorFromWindow)
  "Win32_Graphics_Gdi",
  # ディスプレイの HDR 状態(QueryDisplayConfig / DisplayConfigGetDeviceInfo)
  "Win32_Devices_Display",
] }

