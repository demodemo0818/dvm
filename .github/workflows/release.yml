# タグを push すると、インストーラをビルドして Release の下書きを作る。
#
#   git tag v1.44.0
#   git push origin v1.44.0
#
# 下書きなので、できあがったものを確認してから GitHub 上で「Publish release」を押す。
# 手順の全体は docs/RELEASE.md を見ること。
name: Release

on:
  push:
    tags:
      - "v*"
  # 手元から試したいとき用(タグを打たずに走らせる。Release は作られない)
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      # Release を作るために要る
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Rust のビルドは 500 クレート超あるので、キャッシュが無いと毎回 20 分以上かかる
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 依存パッケージを入れる
        run: npm ci

      # 同梱バイナリはリポジトリに入れていない(gitignore 対象)ので毎回取得する。
      # 詳しくは README の「開発」節。
      # gyan.dev は CI のようなデータセンター IP に 503 を返すことがあり、そのときは
      # GitHub Releases から取り直す。API のレート制限に引っかからないようトークンを渡す
      - name: FFmpeg / ffprobe を取得
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: powershell -ExecutionPolicy Bypass -File scripts/fetch-ffmpeg.ps1

      - name: libmpv の DLL を取得
        run: npx tauri-plugin-libmpv-api setup-lib

      # THIRD-PARTY-NOTICES.md では FFmpeg の版を固定していない(毎回最新を取るため)ので、
      # 「このリリースに入っていたのはどれか」を後から追えるようログに残す。
      # あわせて GPL ビルドのままであることも確認する(LGPL に変わったらライセンス方針の見直し)
      - name: 同梱する FFmpeg の版を記録
        shell: pwsh
        run: |
          $v = & ./src-tauri/binaries/ffmpeg.exe -version
          $v | Select-Object -First 1
          if ($v -join ' ' -notmatch '--enable-gpl') {
            Write-Warning 'FFmpeg が GPL ビルドではありません。THIRD-PARTY-NOTICES.md と本体のライセンスを見直してください'
          }

      # cargo test も tauri.conf.json の bundle.resources の実在チェックを通るので、
      # dvm-mcp.exe が無いと「resource path `binaries\dvm-mcp.exe` doesn't exist」で止まる。
      # 配布ビルドでは beforeBuildCommand が作ってくれるが、テストはその前に走るのでここで用意する。
      # debug で作るのは cargo test と同じプロファイルでコンパイル結果を使い回せるから。
      - name: MCP サーバーをビルド(テスト用)
        run: npm run build:mcp -- -Config debug

      - name: テスト
        run: |
          npm run test
          cd src-tauri
          cargo test

      - name: ビルドして Release の下書きを作る
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # workflow_dispatch(タグ以外)で走らせたときは、空にして Release を作らせない。
          # ここを github.ref_name のままにすると "master" という Release ができてしまう
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseDraft: true
          prerelease: false
          releaseBody: |
            ## インストール

            `DVM_x.y.z_x64-setup.exe` をダウンロードして実行してください。

            > **「WindowsによってPCが保護されました」と出た場合**
            > コード署名をしていないため SmartScreen が警告を出します。
            > 「詳細情報」→「実行」で進めてください。

            変更内容は [CHANGELOG.md](https://github.com/demodemo0818/dvm/blob/master/CHANGELOG.md) を見てください。

      # 署名を付けていないぶん、配布物がすり替わっていないかを利用者が確かめられるように
      # ハッシュを本文へ足す(README でこの照合方法を案内している)。
      # ここが失敗しても Release 自体は残したいので continue-on-error。
      - name: SHA-256 を Release 本文に追記
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          $files = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe, src-tauri/target/release/bundle/msi/*.msi -ErrorAction SilentlyContinue
          if (-not $files) { Write-Host 'インストーラが見つからないので飛ばします'; exit 0 }
          $nl = "`n"
          $rows = $files | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            '| `' + $_.Name + '` | `' + $hash + '` |'
          }
          # gh の出力は PowerShell では行ごとの配列になる。そのまま --notes に渡すと
          # 配列の各要素が別々の引数として展開され「accepts 1 arg(s), received 10」で落ちる
          $body = (gh release view $env:TAG --json body -q .body | Out-String).TrimEnd()
          $add = $nl + $nl + '## SHA-256' + $nl + $nl +
                 '| ファイル | ハッシュ |' + $nl + '|---|---|' + $nl + ($rows -join $nl) + $nl + $nl +
                 '`Get-FileHash <ダウンロードしたファイル>` の出力と見比べてください。'
          # 日本語を含む長文なので、引数ではなくファイルで渡す
          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Set-Content -Path $notesFile -Value ($body + $add) -Encoding utf8NoBOM
          gh release edit $env:TAG --notes-file $notesFile
